name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test          # ← se detiene en la etapa de tests, no llega a final
          load: true            # ← deja la imagen en el Docker local, para poder correrla
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci \
            --collect:"XPlat Code Coverage"

      - name: Reporte de coverage
        if: ${{ !cancelled() }}        # ← también cuando los tests fallaron: es la corrida que se entrega
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -sourcedirs:backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub" "-classfilters:-Program*;-DemoApi.Data.*;-DemoApi.Models.*"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            coveragereport
            TestResults/tests.trx

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-backend:latest
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}        # ← también con el umbral en rojo: es la corrida que se entrega
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # ← si no está, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; solo main despliega
    environment: qa
    steps:
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          # imgURL va como un parámetro más de la URL del hook (que ya trae ?key=…).
          # --get --data-urlencode lo agrega con '&' y le codifica los ':' y '/' de la imagen.
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA corra ESTE commit)
        shell: bash
        env:
          URL_API: https://practica-tp7-api-qa.onrender.com
          URL_FRONT: https://practica-tp7-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if SALUD=$(curl -fsS --max-time 10 "$URL_API/health") \
               && curl -fsS --max-time 10 "$URL_API/api/tareas" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "$SALUD" | grep -q "${GITHUB_SHA}" \
                && { echo "✅ QA responde y corre $GITHUB_SHA"; exit 0; }
              echo "responde, pero todavía con otra versión: $SALUD"
            fi
            sleep 20
          done
          echo "❌ QA no llegó a correr $GITHUB_SHA a tiempo"; exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa                            # PROD solo después de QA vivo
    environment: production                     # ⏸ acá el workflow SE PAUSA hasta el approve
    steps:
      - name: Deploy de la MISMA imagen a PROD
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD (espera a que PROD corra ESTE commit)
        shell: bash
        env:
          URL_API: https://practica-tp7-api-prod.onrender.com
          URL_FRONT: https://practica-tp7-front-prod.onrender.com
        run: |
          for i in $(seq 1 30); do
            if SALUD=$(curl -fsS --max-time 10 "$URL_API/health") \
               && curl -fsS --max-time 10 "$URL_API/api/tareas" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "$SALUD" | grep -q "${GITHUB_SHA}" \
                && { echo "✅ PROD responde y corre $GITHUB_SHA"; exit 0; }
              echo "responde, pero todavía con otra versión: $SALUD"
            fi
            sleep 20
          done
          echo "❌ PROD no llegó a correr $GITHUB_SHA a tiempo"; exit 1
